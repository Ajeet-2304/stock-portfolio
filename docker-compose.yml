services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "stock_portfolio"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "ajeet12345"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
